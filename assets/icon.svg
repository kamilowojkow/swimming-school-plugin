<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#3b82f6"/>

  <!-- Water waves at bottom -->
  <path d="M0 700 Q128 650 256 700 T512 700 T768 700 T1024 700 L1024 1024 L0 1024 Z" fill="#2563eb" opacity="0.5"/>
  <path d="M0 750 Q128 700 256 750 T512 750 T768 750 T1024 750 L1024 1024 L0 1024 Z" fill="#1d4ed8" opacity="0.5"/>

  <!-- Swimmer silhouette (simplified) -->
  <g transform="translate(512, 420)" fill="white">
    <!-- Head -->
    <circle cx="0" cy="-120" r="70"/>
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="85" ry="120"/>
    <!-- Left arm (swimming stroke) -->
    <path d="M-70 -30 Q-200 -80 -280 20" stroke="white" stroke-width="45" fill="none" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M70 -20 Q150 40 200 -10" stroke="white" stroke-width="45" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-30 130 Q-60 220 -40 280" stroke="white" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M30 130 Q60 200 80 260" stroke="white" stroke-width="40" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Water splash effect -->
  <g fill="white" opacity="0.8">
    <circle cx="280" cy="520" r="15"/>
    <circle cx="320" cy="480" r="10"/>
    <circle cx="700" cy="500" r="12"/>
    <circle cx="750" cy="540" r="8"/>
  </g>
</svg>
